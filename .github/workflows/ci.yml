name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      LLM_PROVIDER: mock
      LLM_MODEL: mock-model
      DEFAULT_SCENARIO_ID: chongzhen-early
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate data
        run: npm run check:data

      - name: Validate disposable SQLite save
        run: npm run check:saves

      - name: Test save migrations
        run: npm run test:migrations

      - name: Test logical rollback
        run: npm run test:rollback

      - name: Test save integrity and packages
        run: npm run test:integrity

      - name: Test deterministic replay
        run: npm run test:determinism

      - name: Validate character cards
        run: npm run check:characters

      - name: Test character knowledge views
        run: npm run test:character-views

      - name: Test character memory system
        run: npm run test:character-memory

      - name: Test character security and integration loops
        run: npm run test:character-security

      - name: Test prompt assets and snapshots
        run: npm run test:prompt-assets

      - name: Test meeting state machine
        run: npm run test:meeting-state

      - name: Test speaker scheduler and director
        run: npm run test:meeting-scheduler

      - name: Test meeting recovery and idempotency
        run: npm run test:meeting-recovery

      - name: Test meeting security and confidentiality
        run: npm run test:meeting-security

      - name: Test meeting outcomes and phase 4 integration loops
        run: npm run test:meeting-integration

      - name: Validate policy and rule data
        run: npm run check:policies

      - name: Test rule engine and policy schemas
        run: npm run test:rule-engine

      - name: Test policy lifecycle and tick resolution
        run: npm run test:policy-lifecycle

      - name: Test policy security matrix
        run: npm run test:policy-security

      - name: Test phase 5 integration loops
        run: npm run test:policy-integration
